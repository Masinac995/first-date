<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>First Date ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  width: 90%;
  max-width: 420px;
  padding: 40px 25px;
  text-align: center;
  background: rgba(255,255,255,0.17);
  border-radius: 25px;
  box-shadow: 0 15px 40px rgba(0,0,0,.2);
}

.heart {
  font-size: 70px;
}

h1 {
  font-size: 28px;
  margin: 20px 0 10px;
}

p {
  font-size: 17px;
  margin-bottom: 30px;
}

#yes, #no {
  border: 0;
  border-radius: 50px;
  padding: 16px 30px;
  font-size: 18px;
  font-weight: bold;
}

#yes {
  background: white;
  color: #ff477e;
  margin-right: 15px;
}

#no {
  background: #333;
  color: white;
  position: fixed;
  left: calc(50% + 30px);
  top: calc(50% + 100px);
  z-index: 99999;
}

#result {
  display: none;
}

.kiss {
  font-size: 90px;
}
</style>
</head>

<body>

<div class="card" id="question">

  <div class="heart">❤️</div>

  <h1>Would you kiss me on our first date?</h1>

  <p>Choose carefully... 😏</p>

  <button id="yes">YES ❤️</button>

</div>

<button id="no">NO 😜</button>


<div class="card" id="result">

  <div class="kiss">💋</div>

  <h1>I knew it 😏❤️</h1>

  <p>Now I'm definitely looking forward to our first date.</p>

</div>


<script>

const no = document.getElementById("no");
const yes = document.getElementById("yes");

function runAway(e) {

  if (e) {
    e.preventDefault();
    e.stopPropagation();
  }

  const padding = 20;

  const maxX =
    window.innerWidth -
    no.offsetWidth -
    padding;

  const maxY =
    window.innerHeight -
    no.offsetHeight -
    padding;

  const x =
    padding +
    Math.random() *
    (maxX - padding);

  const y =
    padding +
    Math.random() *
    (maxY - padding);

  no.style.left = x + "px";
  no.style.top = y + "px";

  return false;
}


/* PHONE */

no.addEventListener(
  "touchstart",
  runAway,
  { passive: false }
);


/* MODERN PHONE / TABLET */

no.addEventListener(
  "pointerdown",
  runAway
);


/* COMPUTER */

no.addEventListener(
  "mouseover",
  runAway
);


/* EXTRA PROTECTION */

no.onclick = function(e) {
  runAway(e);
  return false;
};


/* YES */

yes.onclick = function() {

  document.getElementById("question").style.display = "none";

  no.style.display = "none";

  document.getElementById("result").style.display = "block";

};

</script>

</body>
</html>
