<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>First Date ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: white;
    }

    .card {
      width: 90%;
      max-width: 420px;
      padding: 40px 25px;
      text-align: center;
      background: rgba(255,255,255,0.16);
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      backdrop-filter: blur(10px);
    }

    .heart {
      font-size: 65px;
      animation: beat 1s infinite alternate;
    }

    @keyframes beat {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }

    h1 {
      font-size: 29px;
      margin: 20px 0 10px;
    }

    p {
      opacity: 0.9;
      margin-bottom: 35px;
    }

    .buttons {
      position: relative;
      height: 120px;
    }

    button {
      border: none;
      border-radius: 50px;
      padding: 16px 34px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #yes {
      background: white;
      color: #ff477e;
      position: absolute;
      left: 20px;
      top: 20px;
    }

    #no {
      background: #333;
      color: white;
      position: absolute;
      right: 20px;
      top: 20px;
      transition: left 0.12s, top 0.12s;
    }

    #result {
      display: none;
    }

    #result h1 {
      font-size: 35px;
    }

    .kiss {
      font-size: 80px;
    }
  </style>
</head>

<body>

  <div class="card" id="question">

    <div class="heart">❤️</div>

    <h1>Would you kiss me on our first date?</h1>

    <p>Choose carefully... 😏</p>

    <div class="buttons">
      <button id="yes">YES ❤️</button>
      <button id="no">NO 😜</button>
    </div>

  </div>

  <div class="card" id="result">

    <div class="kiss">💋</div>

    <h1
