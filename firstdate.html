<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Bioskop? 🍿</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #5e1734, #1f0713 65%);
      color: white;
      overflow: hidden;
    }

    .card {
      width: min(92%, 500px);
      text-align: center;
      padding: 45px 25px;
      border-radius: 28px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(12px);
      box-shadow: 0 25px 80px rgba(0,0,0,0.35);
    }

    .emoji {
      font-size: 58px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: clamp(30px, 7vw, 48px);
      margin: 0 0 12px;
    }

    p {
      opacity: 0.75;
      margin-bottom: 35px;
      font-size: 17px;
    }

    .buttons {
      position: relative;
      height: 140px;
      max-width: 390px;
      margin: auto;
    }

    button {
      border: none;
      border-radius: 999px;
      font-size: 20px;
      font-weight: bold;
      padding: 16px 35px;
      cursor: pointer;
      transition:
        transform 0.2s ease,
        left 0.25s ease,
        top 0.25s ease,
        background 0.25s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #yesBtn {
      position: absolute;
      left: 15%;
      top: 35px;
      background: #ff477e;
      color: white;
      box-shadow: 0 10px 30px rgba(255,71,126,.35);
    }

    #yesBtn:hover {
      transform: scale(1.08);
    }

    #noBtn {
      position: absolute;
      left: 60%;
      top: 35px;
      background: white;
      color: #4b1026;
      z-index: 10;
    }

    #result {
      min-height: 60px;
      font-size: 25px;
      font-weight: bold;
      margin-top: 15px;
      opacity: 0;
      transform: translateY(15px);
      transition: 0.4s ease;
    }

    #result.show {
      opacity: 1;
      transform: translateY(0);
    }

    .heart {
      position: fixed;
      bottom: -30px;
      font-size: 30px;
      pointer-events: none;
      animation: floatUp 3s linear forwards;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }

      to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    @media (max-width: 500px) {

      .card {
        padding: 35px 18px;
      }

      .buttons {
        height: 180px;
      }

      #yesBtn {
        left: 8%;
      }

      #noBtn {
        left: 58%;
      }

    }
  </style>
</head>

<body>

  <div class="card">

    <div class="emoji">🎬🍿</div>

    <h1>Hoćemo za vikend u bioskop?</h1>

    <p>Pažljivo izaberi odgovor 😏</p>

    <div class="buttons" id="buttonArea">

      <button id="yesBtn">
        DA ❤️
      </button>

      <button id="noBtn">
        NE 😈
      </button>

    </div>

    <div id="result">
      Znao sam 😎🍿❤️
    </div>

  </div>


<script>

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const area = document.getElementById("buttonArea");
const result = document.getElementById("result");

let escapes = 0;
let converted = false;


/* NE dugme beži */

function moveNoButton() {

  if (converted) return;

  escapes++;

  const areaRect = area.getBoundingClientRect();

  const maxX =
    areaRect.width - noBtn.offsetWidth;

  const maxY =
    areaRect.height - noBtn.offsetHeight;

  const randomX =
    Math.max(0, Math.random() * maxX);

  const randomY =
    Math.max(0, Math.random() * maxY);

  noBtn.style.left =
    randomX + "px";

  noBtn.style.top =
    randomY + "px";


  /* nakon 6 pokušaja NE postaje DA */

  if (escapes >= 6) {

    converted = true;

    noBtn.innerHTML =
      "DA 😏";

    noBtn.style.background =
      "#ff477e";

    noBtn.style.color =
      "white";

  }

}


/* Desktop */

noBtn.addEventListener(
  "mouseenter",
  moveNoButton
);


/* Telefon */

noBtn.addEventListener(
  "touchstart",
  function(e) {

    if (!converted) {

      e.preventDefault();

      moveNoButton();

    }

  },
  { passive: false }
);


/* pokušaj klika */

noBtn.addEventListener(
  "click",
  function(e) {

    if (!converted) {

      e.preventDefault();

      moveNoButton();

      return;

    }

    accept();
  }
);


/* DA */

yesBtn.addEventListener(
  "click",
  accept
);


function accept() {

  result.classList.add("show");

  yesBtn.innerHTML =
    "DOGOVORENO ❤️";

  noBtn.style.display =
    "none";

  createHearts();

}


/* srca */

function createHearts() {

  for (let i = 0; i < 25; i++) {

    setTimeout(() => {

      const heart =
        document.createElement("div");

      heart.className =
        "heart";

      heart.innerHTML =
        Math.random() > 0.5
        ? "❤️"
        : "🍿";

      heart.style.left =
        Math.random() * 100 + "vw";

      heart.style.fontSize =
        (20 + Math.random() * 30)
        + "px";

      document.body.appendChild(
        heart
      );

      setTimeout(() => {
        heart.remove();
      }, 3000);

    }, i * 80);

  }

}

</script>

</body>
</html>
